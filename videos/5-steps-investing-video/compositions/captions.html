<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Pin &amp; Paper — Captions</title>
    <!--
      Pin & Paper caption skin (preset-local source — second caption source).

      A pre-baked, brand-token-strict caption sub-composition. emit-chunks copies this to
      design-system/chunks/caption-skin.html for the chosen preset; build-captions-html.mjs
      then fills three reserved holes and writes compositions/captions.html:
        - the empty GROUPS array       → engine's scene-aware, non-overlapping word groups
        - the 0 DURATION + data-duration → real total_duration_s
        - the empty brand-tokens style → the project's tokens.css
      (the filler asserts each hole appears exactly once, so this note avoids the literals)

      Contract (so ONE generic fill works for every preset's skin — no per-skin transform):
        · root carries data-composition-id="captions"; timeline registers window.__timelines["captions"]
        · canonical hooks .caption-group / .caption-word (+ states .is-active / .is-spoken)
        · all colors are var(--*) / color-mix over tokens — brand-strict by construction
        · no <video>, no Google Fonts, no placeholder transcript, no window.<native>() calls
        · state changes use gsap.set({className}) (applied on seek) — NOT .call callbacks
          (callbacks don't fire on the engine's frame-by-frame seek)

      Visual: cream paper card pinned to the page — 1.5px hairline ink border, 4px micro-radius,
      hard ink-blue zero-blur offset shadow, slight askew tilt. The current word wears a cinnabar-red
      rubber-stamp outline; spoken words settle to solid ink. The field-notebook counterpart to the
      registry default caption-pill-karaoke (soft rounded SaaS pill).
    -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>

    <!-- build-captions-html.mjs injects the project's tokens.css here -->
<style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        margin: 0;
        overflow: hidden;
        background: transparent;
      }
      #captions-root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: transparent;
        pointer-events: none;
      }

      /* pin-and-paper · captions · cream paper card pinned to the page — hairline ink border,
         micro-radius, hard ink-blue zero-blur offset shadow, slight askew tilt, cinnabar-red
         rubber-stamp outline on the current word */
      .caption-layer {
        position: absolute;
        inset: 0;
        z-index: 20;
        pointer-events: none;
      }
      .caption-stage {
        position: absolute;
        left: 50%;
        bottom: 36px;
        transform: translateX(-50%);
        width: 1600px;
        height: 210px;
      }
      .caption-group {
        /* every group is absolutely positioned over the SAME band — exactly one is shown
           at a time via opacity. Must be absolute: if groups stay in-flow, N groups lay
           out side-by-side (opacity:0 hides but still occupies space). */
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
      }

      /* THE pinned paper card — cream fill, 1.5px hairline ink border, 4px micro-radius,
         hard ink-blue offset shadow (zero blur), settled slightly askew on the page */
      .caption-pill {
        max-width: 1600px;
        padding: 22px 44px 26px;
        background: var(--surface-cream);
        border: var(--border-hairline);
        border-radius: var(--radius-card);
        box-shadow: var(--shadow-pin-standard);
        transform: rotate(var(--tilt-card-askew));
      }
      .caption-line {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 0.16em 0.34em;
        font-family: var(--font-display);
        font-weight: 700;
        font-size: clamp(40px, 4.4vw, 56px);
        line-height: 1.24;
        letter-spacing: -0.03em;
      }

      /* upcoming — faint ink-blue, no stamp */
      .caption-word {
        display: inline-block;
        padding: 0 0.04em;
        color: color-mix(in srgb, var(--brand-primary) 38%, var(--surface-cream));
      }
      /* current word — THE cinnabar-red rubber-stamp outline (box-shadow ring = stamp w/o
         layout shift), ink-blue glyphs reading over the cream page */
      .caption-word.is-active {
        color: var(--brand-primary);
        background: color-mix(in srgb, var(--brand-accent) 12%, var(--surface-cream));
        box-shadow:
          0 0 0 0.06em var(--brand-accent),
          0 0 0 0.12em color-mix(in srgb, var(--brand-accent) 30%, transparent);
      }
      /* already spoken — solid ink-blue, stamp cleared */
      .caption-word.is-spoken {
        color: var(--brand-primary);
        background: transparent;
        box-shadow: none;
      }

      /* optional per-word accents (dormant until a word-classer tags them) */
      .caption-word.cap-brand {
        color: var(--brand-primary);
        font-style: italic;
      }
      .caption-word.cap-brand.is-active {
        color: var(--brand-primary);
        background: color-mix(in srgb, var(--brand-accent) 14%, var(--surface-cream));
        box-shadow:
          0 0 0 0.06em var(--brand-accent),
          0 0 0 0.12em color-mix(in srgb, var(--brand-accent) 30%, transparent);
      }
      .caption-word.cap-num {
        color: color-mix(in srgb, var(--brand-primary) 72%, var(--surface-cream));
      }
      /* the cinnabar-red stamp underline — the system's hand-drawn emphasis, in red */
      .caption-word.cap-cta {
        text-decoration: underline;
        text-decoration-thickness: 3px;
        text-decoration-color: var(--brand-accent);
        text-underline-offset: 0.08em;
      }

      @media (max-aspect-ratio: 9/16) {
        .caption-stage {
          bottom: 100px;
          width: 92%;
        }
        .caption-line {
          font-size: clamp(34px, 5.4vw, 46px);
        }
      }
    </style>
  </head>

        GROUPS.forEach(function (group, g) {
          var groupEl = document.getElementById("caption-group-" + g);
          var words = group.words || [];
          var next = GROUPS[g + 1];
          var isLast = g === GROUPS.length - 1;
          var start = Math.max(0, Number(group.start));
          var end = isLast ? DURATION : Math.min(Number(next.start), Number(group.end) + 0.3);

          // group on/off — exactly one group visible at a time
          tl.set(groupEl, { opacity: 1 }, start);
          tl.set(groupEl, { opacity: 0 }, end);

          // 3-state karaoke via className SETS — seek-safe (gsap.set applies on the
