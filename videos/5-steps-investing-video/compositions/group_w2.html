    <script>
      // EASE / DUR from dispatch easings.js
      const EASE = {
        entry: "power2.out",
        emphasis: "power3.out",
        exit: "power2.in",
        drift: "sine.inOut",
      };
      const DUR = { snap: 0.18, med: 0.5, slow: 0.95 };

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // Segment start offsets (continue run — one shared timeline)
      const T = { scene_2: 0, scene_3: 5.312, scene_4: 11.648 };

      // ---------------- initial hidden states (gsap.set, not CSS) ----------------
      // Scene 2
      gsap.set(["#s2-card-0", "#s2-card-1", "#s2-card-2"], { opacity: 0 });
      gsap.set(["#s2-arrow-line", "#s2-arrow-head"], { opacity: 1 });
      gsap.set("#s2-arrow-note", { opacity: 0, y: 10 });

      // Scene 3
      gsap.set("#s3-jar", { opacity: 0, y: 14 });
      gsap.set("#s3-jar-label", { opacity: 0 });
      gsap.set("#s3-jar-fill", { scaleY: 0 });
      gsap.set("#s3-debt", { opacity: 0 });
      gsap.set("#s3-debt-note", { opacity: 0 });
      gsap.set(["#s3-debt-slack-l", "#s3-debt-slack-r"], { opacity: 0 });
      gsap.set("#s3-debt-thread", { opacity: 1 });

      // Scene 4
      gsap.set("#s4-stage", { opacity: 0 });
      gsap.set("#s4-stamp", { opacity: 0, scale: 1.18, rotation: -4 });

      // Persistent seedling — visible from the start of scene 3 (carried subject)
      // hold hidden during scene 2, fade in at scene 3
      gsap.set("#g2-seedling", { opacity: 0, scale: 0.9 });

      // Stage camera resets per segment (one macro move each)
      gsap.set("#g2-stage", { scale: 1, x: 0, y: 0 });

      // Step lockup — prebuilt numeral/eyebrow layers, crossfaded across the run
      gsap.set(["#g2-num-2", "#g2-num-3", "#g2-eb-2", "#g2-eb-3"], { opacity: 0 });
      gsap.set(["#g2-num-1", "#g2-eb-1"], { opacity: 0, y: 12 });
      tl.to(["#g2-num-1", "#g2-eb-1"], { opacity: 1, y: 0, duration: DUR.med, ease: EASE.emphasis }, T.scene_2 + 0.1);
      // -> step 02
      tl.to(["#g2-num-1", "#g2-eb-1"], { opacity: 0, duration: DUR.med, ease: EASE.exit }, T.scene_3 - 0.35);
      tl.to(["#g2-num-2", "#g2-eb-2"], { opacity: 1, duration: DUR.med, ease: EASE.emphasis }, T.scene_3 - 0.15);
      // -> step 03
      tl.to(["#g2-num-2", "#g2-eb-2"], { opacity: 0, duration: DUR.med, ease: EASE.exit }, T.scene_4 - 0.35);
      tl.to(["#g2-num-3", "#g2-eb-3"], { opacity: 1, duration: DUR.med, ease: EASE.emphasis }, T.scene_4 - 0.15);

      // ===================================================================
      // SCENE 2 — goal cards burst + timeline arrow draw  (center-outward-expansion, svg-path-draw, sine-wave-loop)
      // ===================================================================
      const s2cards = [
        document.querySelector("#s2-card-0"),
        document.querySelector("#s2-card-1"),
        document.querySelector("#s2-card-2"),
      ];
      // center-outward-expansion: cards fan from clustered center to pinned spots
      s2cards.forEach((el, i) => {
        const tx = Number(el.dataset.targetX);
        const ty = Number(el.dataset.targetY);
        tl.fromTo(
          el,
          { xPercent: -50, yPercent: -50, x: 0, y: 0, scale: 0.62, opacity: 0 },
          { x: tx, y: ty, scale: 1, opacity: 1, duration: DUR.slow, ease: EASE.entry },
          T.scene_2 + 0.2 + i * 0.16,
        );
      });

      // svg-path-draw: timeline arrow draws left -> right beneath the cards
      const s2paths = document.querySelectorAll("#s2-arrow path");
      s2paths.forEach((p) => {
        const len = p.getTotalLength();
        p.style.strokeDasharray = String(len);
        p.style.strokeDashoffset = String(len);
      });
      tl.to("#s2-arrow-line", { strokeDashoffset: 0, duration: DUR.slow, ease: "power2.out" }, T.scene_2 + 1.1);
      tl.to("#s2-arrow-head", { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" }, T.scene_2 + 1.9);
      tl.to("#s2-arrow-note", { opacity: 1, y: 0, duration: DUR.med, ease: EASE.entry }, T.scene_2 + 2.2);

      // macro: gentle dolly-in on the whole stage across scene 2
      tl.fromTo(
        "#g2-stage",
        { scale: 1.0 },
        { scale: 1.04, duration: 5.0, ease: "power1.inOut" },
        T.scene_2 + 0.2,
      );

      // sine-wave-loop: last-landed card (s2-card-2) breathes after it lands
      const s2breath = { p: 0 };
      const S2_IDLE_START = T.scene_2 + 2.0;
      const S2_IDLE_DUR = 3.0;
      tl.to(
        s2breath,
        {
          p: Math.PI * 2 * 1.2,
          duration: S2_IDLE_DUR,
          ease: "none",
          onUpdate: () => {
            const el = document.querySelector("#s2-card-2");
            const y = Math.sin(s2breath.p) * 3;
            const sc = 1 + Math.sin(s2breath.p) * 0.01;
            el.style.transform = `translate(-50%, -50%) translate(540px, ${0 + y}px) scale(${sc})`;
          },
        },
        S2_IDLE_START,
      );
      // hide scene-2 cluster as the run advances into scene 3 (internal continuity, not a wrapper transition)
      tl.to(["#s2-card-0", "#s2-card-1", "#s2-card-2", "#s2-arrow", "#s2-arrow-note"], { opacity: 0, duration: DUR.med, ease: EASE.exit }, T.scene_3 - 0.45);

      // ===================================================================
      // SCENE 3 — jar fills + debt thread cut  (stat-bars-and-fills, svg-icon-enrichment, sine-wave-loop)
      // ===================================================================
      // reset stage camera for the slow push toward the jar
      tl.set("#g2-stage", { scale: 1.0, x: 0, y: 0 }, T.scene_3 - 0.2);

      tl.to("#s3-jar", { opacity: 1, y: 0, duration: DUR.med, ease: EASE.entry }, T.scene_3 + 0.1);
      tl.to("#s3-jar-label", { opacity: 1, duration: DUR.med, ease: EASE.entry }, T.scene_3 + 0.2);
      // stat-bars-and-fills: jar fills with green to the marked safe line
      tl.to("#s3-jar-fill", { scaleY: 0.84, duration: 1.3, ease: "power2.out" }, T.scene_3 + 0.4);

      // seedling enters here — established as the carried subject for the run
      tl.to("#g2-seedling", { opacity: 1, scale: 1.0, duration: DUR.med, ease: EASE.entry }, T.scene_3 + 0.3);

      // svg-icon-enrichment: debt thread cut — blades close, thread goes slack
      tl.to("#s3-debt", { opacity: 1, duration: DUR.med, ease: EASE.entry }, T.scene_3 + 0.4);
      tl.to("#s3-debt-note", { opacity: 1, duration: DUR.med, ease: EASE.entry }, T.scene_3 + 0.6);
      // blades oscillate closed (scissor cut)
      const s3cut = { p: 0 };
      tl.to(
        s3cut,
        {
          p: 1,
          duration: 0.5,
          ease: "power2.inOut",
          onUpdate: () => {
            const a = document.getElementById("s3-blade-a");
            const b = document.getElementById("s3-blade-b");
            const close = s3cut.p * 8; // degrees toward closed
            a.setAttribute("transform", `rotate(${close} 232 60)`);
            b.setAttribute("transform", `rotate(${-close} 288 60)`);
          },
        },
        T.scene_3 + 1.4,
      );
      // at the cut moment, taut thread hides and slack ends drop
      tl.to("#s3-debt-thread", { opacity: 0, duration: 0.12, ease: "none" }, T.scene_3 + 1.75);
      tl.to(["#s3-debt-slack-l", "#s3-debt-slack-r"], { opacity: 1, duration: 0.28, ease: EASE.entry }, T.scene_3 + 1.78);

      // seedling grows ONE notch taller as the jar tops out (scaleY on the grow group)
      tl.fromTo(
        "#g2-seed-grow",
        { scaleY: 0.82 },
        { scaleY: 1.0, duration: 0.9, ease: EASE.emphasis },
        T.scene_3 + 1.6,
      );

      // macro: slow push toward the jar across scene 3
      tl.to("#g2-stage", { scale: 1.05, x: 90, duration: 5.6, ease: "power1.inOut" }, T.scene_3 + 0.2);

      // boundary into scene 4: jar + thread settle to quiet supporting state lower-left, seedling holds
      tl.to("#s3-jar", { scale: 0.62, x: -360, y: 210, opacity: 0.55, duration: DUR.slow, ease: EASE.exit, transformOrigin: "50% 50%" }, T.scene_4 - 0.7);
      tl.to(["#s3-jar-label", "#s3-debt-note"], { opacity: 0, duration: DUR.med, ease: EASE.exit }, T.scene_4 - 0.7);
      tl.to("#s3-debt", { scale: 0.5, x: -560, y: 230, opacity: 0.45, duration: DUR.slow, ease: EASE.exit, transformOrigin: "50% 50%" }, T.scene_4 - 0.7);

      // ===================================================================
      // SCENE 4 — account folders fan in + stamp press  (orbit-3d-entry, card-morph-anchor, sine-wave-loop)
      // ===================================================================
      tl.set("#g2-stage", { scale: 1.0, x: 0, y: 0 }, T.scene_4 - 0.2);
      tl.to("#s4-stage", { opacity: 1, duration: 0.2, ease: "none" }, T.scene_4);

      // orbit-3d-entry (entry phase only — flip in from 3D to their fanned spots)
      const s4folders = [
        document.querySelector("#s4-folder-0"),
        document.querySelector("#s4-folder-1"),
        document.querySelector("#s4-folder-2"),
      ];
      s4folders.forEach((el, i) => {
        const tx = Number(el.dataset.targetX);
        const ty = Number(el.dataset.targetY);
        gsap.set(el, {
          xPercent: -50, yPercent: -50,
          x: tx, y: ty,
          rotateX: 80, rotateY: -40, z: -260, scale: 0.4, opacity: 0,
        });
        tl.to(
          el,
          { rotateX: 0, rotateY: 0, z: 0, scale: 1, opacity: 1, duration: 0.7, ease: "power3.out" },
          T.scene_4 + 0.2 + i * 0.14,
        );
      });

      // card-morph-anchor: TAX-ADVANTAGED stamp ink-presses onto the first two folders (anchors the seat)
      // stamp slam: scale 1.18 -> 1 at -4deg (never counter-rotate to 0)
      tl.to(
        "#s4-stamp",
        { opacity: 1, scale: 1.0, rotation: -4, duration: 0.4, ease: EASE.emphasis },
        T.scene_4 + 1.3,
      );

      // sine-wave-loop: seedling is the single live element — breathes through scene 4
      const s4breath = { p: 0 };
      const S4_IDLE_START = T.scene_4 + 0.8;
      const S4_IDLE_DUR = 18.581 - S4_IDLE_START - 0.05;
      tl.to(
        s4breath,
        {
          p: Math.PI * 2 * 2.0,
          duration: S4_IDLE_DUR,
          ease: "none",
          onUpdate: () => {
            const el = document.querySelector("#g2-seedling");
            const t = s4breath.p / (Math.PI * 2 * 2.0);
            const FADE = 0.2;
            const env = t < 1 - FADE ? 1 : (1 - t) / FADE;
            const y = Math.sin(s4breath.p) * 3 * env;
            const sc = 1 + Math.sin(s4breath.p) * 0.012 * env;
            el.style.transform = `translateY(${y}px) scale(${sc})`;
          },
        },
        S4_IDLE_START,
      );

      // macro: slow drift across the folder fan
      tl.to("#g2-stage", { x: -70, duration: 6.4, ease: "power1.inOut" }, T.scene_4 + 0.2);

      window.__timelines["group_w2"] = tl;
    </script>
  </div>
</template>
